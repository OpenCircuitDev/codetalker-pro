# CCT-31 — companion-android Gradle properties
# Standard AGP 8+ flags. Generated 2026-05-09 to satisfy
# checkDebugAarMetadata's requirement that AndroidX is explicitly enabled.

# Use AndroidX libraries (required by AGP 8+).
android.useAndroidX=true

# Don't auto-Jetifier-translate older androidx-renamed libs (we use only
# native AndroidX coords).
android.nonTransitiveRClass=true

# JVM args for the Gradle daemon. Keep modest so it works on dev laptops.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Kotlin code style aligns with Android Studio's default.
kotlin.code.style=official

# Parallel project execution speeds up multi-module builds (we're single-
# module today but it's free).
org.gradle.parallel=true

# Configuration cache speeds up subsequent builds significantly.
org.gradle.configuration-cache=true
