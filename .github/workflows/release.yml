# CCT-32 Task E.3 — GitHub Actions release workflow.
#
# Triggers on the push of a tag matching v*.*.*. Restores the release
# keystore from a base64-encoded GitHub Secret, runs the test gate,
# builds a signed AAB + APK, and attaches them to the GitHub Release
# along with the rendered release notes from CHANGELOG.md.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets and variables → Actions):
#
#   CCT_KEYSTORE_BASE64    Base64 of the release keystore.
#                          Generate with: base64 -i release.keystore | pbcopy
#   CCT_KEYSTORE_PASSWORD  Keystore password.
#   CCT_KEY_ALIAS          Key alias (default: codetalker)
#   CCT_KEY_PASSWORD       Key password.
#   CCT_SENTRY_DSN         Optional. Sentry DSN for crash-report routing.
#
# Without those secrets set, the workflow still runs the test gate but
# the bundle/apk uploads will be unsigned (and Play / XREAL Store will
# reject them at upload time).

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write          # required to create / update GitHub Releases.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so CHANGELOG diffs work.

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        if: env.CCT_KEYSTORE_BASE64 != ''
        env:
          CCT_KEYSTORE_BASE64: ${{ secrets.CCT_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/keystore
          echo "$CCT_KEYSTORE_BASE64" | base64 --decode > $HOME/keystore/release.keystore
          # Stash the path; signing config reads CCT_KEYSTORE_FILE.
          echo "CCT_KEYSTORE_FILE=$HOME/keystore/release.keystore" >> $GITHUB_ENV

      - name: Run unit tests
        run: |
          cd companion-android
          ./gradlew testDebugUnitTest --console=plain --no-daemon

      - name: Run release-check E2E gate
        run: |
          cd companion-android
          bash scripts/e2e/run_release_check.sh

      - name: Build release bundle (AAB)
        env:
          CCT_KEYSTORE_FILE: ${{ env.CCT_KEYSTORE_FILE }}
          CCT_KEYSTORE_PASSWORD: ${{ secrets.CCT_KEYSTORE_PASSWORD }}
          CCT_KEY_ALIAS: ${{ secrets.CCT_KEY_ALIAS }}
          CCT_KEY_PASSWORD: ${{ secrets.CCT_KEY_PASSWORD }}
          CCT_SENTRY_DSN: ${{ secrets.CCT_SENTRY_DSN }}
        run: |
          cd companion-android
          ./gradlew bundleRelease --console=plain --no-daemon

      - name: Build release APK (universal)
        env:
          CCT_KEYSTORE_FILE: ${{ env.CCT_KEYSTORE_FILE }}
          CCT_KEYSTORE_PASSWORD: ${{ secrets.CCT_KEYSTORE_PASSWORD }}
          CCT_KEY_ALIAS: ${{ secrets.CCT_KEY_ALIAS }}
          CCT_KEY_PASSWORD: ${{ secrets.CCT_KEY_PASSWORD }}
          CCT_SENTRY_DSN: ${{ secrets.CCT_SENTRY_DSN }}
        run: |
          cd companion-android
          ./gradlew assembleRelease --console=plain --no-daemon

      - name: Compute artefact checksums
        run: |
          cd companion-android/app/build/outputs
          shopt -s nullglob
          if compgen -G "bundle/release/app-release.aab" > /dev/null; then
            sha256sum bundle/release/app-release.aab > bundle/release/app-release.aab.sha256
          fi
          if compgen -G "apk/release/app-release.apk" > /dev/null; then
            sha256sum apk/release/app-release.apk > apk/release/app-release.apk.sha256
          fi

      - name: Render release notes from CHANGELOG
        id: render_notes
        run: |
          cd companion-android
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          # Pull the CHANGELOG section between [version] and the next [vN].
          awk "/## \\[${version}\\]/{flag=1; next} /## \\[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "(release notes for $version not found in CHANGELOG.md)" > /tmp/release-notes.md
          fi
          {
            echo "# codetalker companion ${tag}"
            echo ""
            cat /tmp/release-notes.md
            echo ""
            echo "## Verifying the build"
            echo ""
            echo "\`\`\`"
            echo "sha256sum app-release.apk"
            echo "\`\`\`"
            echo ""
            echo "Expected SHA-256 fingerprints are appended below as \`*.sha256\` files."
          } > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-body.md
          generate_release_notes: false
          files: |
            companion-android/app/build/outputs/bundle/release/app-release.aab
            companion-android/app/build/outputs/bundle/release/app-release.aab.sha256
            companion-android/app/build/outputs/apk/release/app-release.apk
            companion-android/app/build/outputs/apk/release/app-release.apk.sha256
            companion-android/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
